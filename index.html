<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>orbit</title>
<meta name="description" content="orbit is coming soon.">
<meta name="theme-color" content="#02030a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02030a;overflow:hidden;color:#eef2ff;font-family:'Jost','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;opacity:0;transition:opacity 2.4s ease}
canvas.on{opacity:1}
canvas:active{cursor:grabbing}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(2,3,10,.35) 0%,rgba(2,3,10,0) 38%,rgba(2,3,10,.55) 100%)}
.t{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 5vw;animation:in 3s .6s ease both}
h1{margin:0;font-weight:200;font-size:clamp(3.6rem,12vw,9.5rem);line-height:1;letter-spacing:.2em;margin-right:-.2em;text-shadow:0 0 30px rgba(2,3,12,.9),0 0 80px rgba(2,3,12,.8),0 0 120px rgba(90,110,255,.25)}
p{margin:1.4rem 0 0;font-weight:300;font-size:clamp(.72rem,1.7vw,1.05rem);letter-spacing:.6em;margin-right:-.6em;color:#c9d2f5;text-shadow:0 0 20px rgba(2,3,12,.95),0 0 50px rgba(2,3,12,.9)}
@keyframes in{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}
body.nogl{background:radial-gradient(ellipse at 50% 55%,#141a3d 0%,#070a1c 45%,#02030a 100%)}
@media(prefers-reduced-motion:reduce){.t{animation:none}canvas{transition:none}}
</style>
</head>
<body>
<div class="vig"></div>
<div class="t"><h1>orbit</h1><p>is coming soon</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.body.classList.add('nogl');return}
var renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'})}catch(e){document.body.classList.add('nogl');return}
var PI=Math.PI,TAU=PI*2;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.prepend(renderer.domElement);
var scene=new THREE.Scene();scene.background=new THREE.Color(0x02030a);
var camera=new THREE.PerspectiveCamera(40,1,.5,4000);


function hash(x,y){var h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)}
function vn(x,y,p){var ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
 fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
 var a=ix%p;if(a<0)a+=p;var b=(ix+1)%p;if(b<0)b+=p;
 var n00=hash(a,iy),n10=hash(b,iy),n01=hash(a,iy+1),n11=hash(b,iy+1);
 return n00+(n10-n00)*fx+(n01-n00)*fy+(n00-n10-n01+n11)*fx*fy}
function fbm(x,y,p){var s=0,a=.5;for(var o=0;o<5;o++){s+=a*vn(x,y,p);x*=2;y*=2;p*=2;a*=.5}return s/.97}
var L=function(a,b,t){t=t<0?0:t>1?1:t;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]};
function mk(fn,w,h){w=w||512;h=h||256;var c=document.createElement('canvas');c.width=w;c.height=h;
 var x=c.getContext('2d'),d=x.createImageData(w,h),k=0;
 for(var j=0;j<h;j++)for(var i=0;i<w;i++){var p=fn(i/w,j/h);d.data[k++]=p[0];d.data[k++]=p[1];d.data[k++]=p[2];d.data[k++]=p[3]===undefined?255:p[3]}
 x.putImageData(d,0,0);var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
function glowTex(stops){var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d'),g=x.createRadialGradient(128,128,0,128,128,128);
 stops.forEach(function(s){g.addColorStop(s[0],s[1])});x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)}

var T={
mercury:function(u,v){var n=fbm(u*8,v*4,8),c=fbm(u*26,v*13,26),g=85+n*95-(c>.64?34:0);return[g,g*.96,g*.92]},
venus:function(u,v){var n=fbm(u*4,v*8+fbm(u*3,v*3,3)*2.5,4);return L([185,140,80],[240,215,160],n*1.2-.1)},
earth:function(u,v){var h=fbm(u*5,v*2.5,5)+(fbm(u*14,v*7,14)-.5)*.22,lat=Math.abs(v-.5)*2;
 if(lat>.9+(fbm(u*8,v*8,8)-.5)*.12)return[240,246,252];
 if(h>.56){var c=L([38,92,42],[158,136,86],(h-.56)*4.5);if(lat<.32)c=L(c,[205,172,100],(1-lat/.32)*fbm(u*10,v*10,10)*.9);return c}
 return L([22,78,140],[4,18,58],(.56-h)*2.6)},
clouds:function(u,v){var n=fbm(u*6+fbm(u*3,v*3,3)*.8,v*3.4,6);return[255,255,255,Math.min(255,Math.max(0,(n-.48))*2.6*255)]},
mars:function(u,v){var n=fbm(u*6,v*3,6),lat=Math.abs(v-.5)*2;if(lat>.94)return[238,238,244];
 var c=L([178,88,50],[124,58,36],n*1.3-.1);return n>.6?L(c,[70,36,26],.5):c},
jupiter:function(u,v){var w=fbm(u*4,v*6,4),b=Math.sin(v*PI*15+w*5)*.5+.5,c=L([214,176,136],[148,92,62],b),f=.85+.3*fbm(u*8,v*40,8);
 var dx=(u-.3)/.07,dy=(v-.64)/.036,d=Math.sqrt(dx*dx+dy*dy);
 if(d<1.5)c=L(c,[188,66,40],(1.5-d)*1.4);return[c[0]*f,c[1]*f,c[2]*f]},
saturn:function(u,v){var b=Math.sin(v*PI*11+fbm(u*3,v*5,3)*2.5)*.5+.5,f=.9+.2*fbm(u*6,v*30,6),c=L([222,200,150],[172,142,98],b);return[c[0]*f,c[1]*f,c[2]*f]},
uranus:function(u,v){return L([140,208,218],[118,190,208],fbm(u*2,v*4,2)*1.4)},
neptune:function(u,v){var b=fbm(u*3,v*6+fbm(u*2,v*4,2)*1.5,3),c=L([32,62,196],[70,120,236],b*1.3);
 var dx=(u-.6)/.06,dy=(v-.55)/.04;if(dx*dx+dy*dy<1)c=L(c,[16,30,110],.55);return c},
sun:function(u,v){var n=fbm(u*8,v*4,8),m=fbm(u*20,v*10,20);return L([255,120,20],[255,236,170],n*1.1+m*.25)}
};


scene.add(new THREE.AmbientLight(0x1a2244,.55));
var sunLight=new THREE.PointLight(0xfff1dc,2.1,0,0);scene.add(sunLight);


(function(){
 var N=7000,pos=new Float32Array(N*3),col=new Float32Array(N*3),c=new THREE.Color();
 for(var i=0;i<N;i++){var r=1500+Math.random()*400,th=Math.random()*TAU,ph=Math.acos(2*Math.random()-1);
  pos.set([r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th)],i*3);
  var t=Math.random(),b=.35+Math.pow(Math.random(),3)*.65;c.setHSL(t<.6?.6:t<.85?.08:.75,t<.6?.35:.5,.65+b*.3);c.multiplyScalar(b+.2);col.set([c.r,c.g,c.b],i*3)}
 var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.7,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.95,depthWrite:false})));

 var M=5000,dp=new Float32Array(M*3),dc=new Float32Array(M*3);
 for(i=0;i<M;i++){var a=Math.random()*TAU,rr=1400,y=(Math.random()+Math.random()+Math.random()-1.5)*220;
  var v=new THREE.Vector3(Math.cos(a)*rr,y,Math.sin(a)*rr).applyEuler(new THREE.Euler(.9,.4,.3));dp.set([v.x,v.y,v.z],i*3);
  c.setHSL(.62+Math.random()*.15,.4,.35+Math.random()*.25);dc.set([c.r*.6,c.g*.6,c.b*.7],i*3)}
 var dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));dg.setAttribute('color',new THREE.BufferAttribute(dc,3));
 scene.add(new THREE.Points(dg,new THREE.PointsMaterial({size:1.2,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.55,depthWrite:false})));

 var neb=[[0x5b3cc4,-900,260,-1100,1100,.16],[0x1f4fd8,1000,-200,-900,1000,.14],[0x8a2be2,300,500,1200,900,.1],[0x2a6fdb,-1200,-300,600,900,.1],[0xb9c4ff,700,380,-1250,260,.28],[0xffd9b0,-600,-420,-1300,200,.22]];
 neb.forEach(function(n){var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex([[0,'rgba(255,255,255,.9)'],[.25,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']]),color:n[0],transparent:true,opacity:n[5],blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  s.position.set(n[1],n[2],n[3]);s.scale.set(n[4],n[4]*(n[4]<400?.35:.7),1);s.material.rotation=Math.random()*3;scene.add(s)});
})();


var sun=new THREE.Mesh(new THREE.SphereGeometry(9,64,64),new THREE.MeshBasicMaterial({map:mk(T.sun,512,256),color:0xffffff}));
scene.add(sun);
[[44,0xffb050,.55],[110,0xff7a2a,.22],[260,0x5b7cff,.07]].forEach(function(s){
 var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex([[0,'rgba(255,255,255,1)'],[.18,'rgba(255,255,255,.55)'],[.5,'rgba(255,255,255,.12)'],[1,'rgba(255,255,255,0)']]),color:s[1],transparent:true,opacity:s[2],blending:THREE.AdditiveBlending,depthWrite:false}));
 sp.scale.set(s[0],s[0],1);scene.add(sp)});


var atmoMat=function(c,k){return new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false,uniforms:{c:{value:new THREE.Color(c)},k:{value:k}},
 vertexShader:'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 c;uniform float k;varying vec3 n;void main(){float i=pow(max(.72-dot(n,vec3(0,0,1.)),0.),2.6)*k;gl_FragColor=vec4(c*i,i);}'})};
var D=[
 {n:'mercury',r:.9,d:17,t:.03,spin:.2,tex:T.mercury,rough:.95},
 {n:'venus',r:1.5,d:23,t:3.09,spin:-.05,tex:T.venus,rough:.85,atm:[0xffc880,1.6]},
 {n:'earth',r:1.6,d:31,t:.41,spin:1.2,tex:T.earth,rough:.55,atm:[0x4d9cff,3.2],clouds:1,moon:1},
 {n:'mars',r:1.15,d:39,t:.44,spin:1.1,tex:T.mars,rough:.92,atm:[0xe08a5a,.9]},
 {n:'jupiter',r:4.6,d:60,t:.05,spin:2.4,tex:T.jupiter,rough:.8,atm:[0xe0b890,.7]},
 {n:'saturn',r:3.9,d:82,t:.47,spin:2.1,tex:T.saturn,rough:.8,atm:[0xf0dcaa,.6],rings:1},
 {n:'uranus',r:2.5,d:102,t:1.7,spin:-1.2,tex:T.uranus,rough:.7,atm:[0x8ae8f0,2.2]},
 {n:'neptune',r:2.4,d:120,t:.5,spin:1.3,tex:T.neptune,rough:.7,atm:[0x4a70ff,2.8]}
];
var bodies=[],cloudMesh,moon;
D.forEach(function(p,idx){
 var pivot=new THREE.Group(),tilt=new THREE.Group(),
  mesh=new THREE.Mesh(new THREE.SphereGeometry(p.r,64,64),new THREE.MeshStandardMaterial({map:mk(p.tex,512,256),roughness:p.rough,metalness:0}));
 tilt.rotation.z=p.t;tilt.add(mesh);pivot.add(tilt);pivot.position.x=p.d;
 var holder=new THREE.Group();holder.add(pivot);scene.add(holder);
 if(p.atm){var a=new THREE.Mesh(new THREE.SphereGeometry(p.r*1.14,48,48),atmoMat(p.atm[0],p.atm[1]));pivot.add(a)}
 if(p.clouds){cloudMesh=new THREE.Mesh(new THREE.SphereGeometry(p.r*1.012,64,64),new THREE.MeshStandardMaterial({map:mk(T.clouds,512,256),transparent:true,roughness:1,depthWrite:false}));tilt.add(cloudMesh)}
 if(p.moon){moon=new THREE.Mesh(new THREE.SphereGeometry(.42,32,32),new THREE.MeshStandardMaterial({map:mk(T.mercury,256,128),roughness:1}));pivot.add(moon)}
 if(p.rings){
  var rg=new THREE.RingGeometry(p.r*1.25,p.r*2.3,160,1),pa=rg.attributes.position,uv=rg.attributes.uv,v3=new THREE.Vector3();
  for(var i=0;i<pa.count;i++){v3.fromBufferAttribute(pa,i);uv.setXY(i,(v3.length()-p.r*1.25)/(p.r*1.05),1)}
  var rc=document.createElement('canvas');rc.width=1024;rc.height=1;var rx=rc.getContext('2d'),rd=rx.createImageData(1024,1);
  for(i=0;i<1024;i++){var t=i/1024,a2=0,l=0;
   if(t<.12)a2=.18+t*2;else if(t<.4)a2=.55+.25*Math.sin(t*60);else if(t<.45)a2=.04;else if(t<.9)a2=.78+.18*Math.sin(t*140);else a2=Math.max(0,(1-t)*5);
   a2*=.72+.28*hash(i*.37,3);l=170+60*hash(i*.11,7)+(t<.4?-25:0);
   rd.data.set([l,l*.92,l*.78,Math.max(0,Math.min(1,a2))*255],i*4)}
  rx.putImageData(rd,0,0);var rt=new THREE.CanvasTexture(rc);rt.encoding=THREE.sRGBEncoding;
  var ring=new THREE.Mesh(rg,new THREE.MeshStandardMaterial({map:rt,transparent:true,side:THREE.DoubleSide,roughness:.9,depthWrite:false}));
  ring.rotation.x=-PI/2;tilt.add(ring)}

 var pts=[];for(i=0;i<=256;i++){var q=i/256*TAU;pts.push(new THREE.Vector3(Math.cos(q)*p.d,0,Math.sin(q)*p.d))}
 scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x7c92d8,transparent:true,opacity:.2,depthWrite:false})));
 bodies.push({holder:holder,mesh:mesh,w:TAU/70*Math.pow(31/p.d,1.5),spin:p.spin,a:Math.random()*TAU})
});

(function(){var N=2600,pos=new Float32Array(N*3);for(var i=0;i<N;i++){var a=Math.random()*TAU,r=46+Math.random()*7;pos.set([Math.cos(a)*r,(Math.random()-.5)*1.6,Math.sin(a)*r],i*3)}
 var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 var belt=new THREE.Points(g,new THREE.PointsMaterial({size:1.3,sizeAttenuation:false,color:0x9aa3c0,transparent:true,opacity:.55,depthWrite:false}));belt.name='belt';scene.add(belt)})();


var theta=.7,phi=1.17,vt=0,vp=0,zoom=1,zT=1,fit=200,drag=false,ptrs={},pd=0,lx=0,ly=0;
function resize(){var w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h,false);camera.aspect=a;
 var th=Math.tan(camera.fov*PI/360);camera.updateProjectionMatrix();fit=Math.max(190,150/(th*Math.min(a,1.7)))}
addEventListener('resize',resize);resize();
var el=renderer.domElement;
el.addEventListener('pointerdown',function(e){el.setPointerCapture(e.pointerId);ptrs[e.pointerId]=e;lx=e.clientX;ly=e.clientY;drag=true;vt=vp=0;
 var k=Object.keys(ptrs);if(k.length==2)pd=Math.hypot(ptrs[k[0]].clientX-ptrs[k[1]].clientX,ptrs[k[0]].clientY-ptrs[k[1]].clientY)});
el.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId])return;ptrs[e.pointerId]=e;var k=Object.keys(ptrs);
 if(k.length==2){var d=Math.hypot(ptrs[k[0]].clientX-ptrs[k[1]].clientX,ptrs[k[0]].clientY-ptrs[k[1]].clientY);zT=Math.min(1.7,Math.max(.12,zT*pd/d));pd=d}
 else{var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;vt=-dx*.0035;vp=-dy*.0035;theta+=vt;phi+=vp}});
var up=function(e){delete ptrs[e.pointerId];if(!Object.keys(ptrs).length)drag=false;else{var k=Object.keys(ptrs);lx=ptrs[k[0]].clientX;ly=ptrs[k[0]].clientY}};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',function(e){e.preventDefault();zT=Math.min(1.7,Math.max(.12,zT*Math.exp(e.deltaY*.0012)))},{passive:false});


var clock=new THREE.Clock(),time=0;
function frame(){requestAnimationFrame(frame);var dt=Math.min(clock.getDelta(),.05);time+=dt;
 bodies.forEach(function(b){b.a+=b.w*dt;b.holder.rotation.y=-b.a;b.mesh.rotation.y+=b.spin*dt*1.4});
 if(cloudMesh)cloudMesh.rotation.y+=dt*1.2;
 if(moon){var m=time*.9;moon.position.set(Math.cos(m)*3.2,Math.sin(m*.5)*.2,Math.sin(m)*3.2)}
 sun.rotation.y+=dt*.03;
 if(!drag){theta+=vt+.012*dt;phi+=vp;vt*=.95;vp*=.95}
 phi=Math.min(PI-.2,Math.max(.2,phi));zoom+=(zT-zoom)*.08;
 var r=fit*zoom,th=theta+Math.sin(time*.11)*.035,ph=phi+Math.sin(time*.087)*.012;
 camera.position.set(r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph),r*Math.sin(ph)*Math.cos(th));
 camera.lookAt(0,0,0);
 renderer.render(scene,camera)}
frame();
requestAnimationFrame(function(){el.classList.add('on')});
})();
</script>
<noscript><style>canvas{display:none}body{background:radial-gradient(ellipse at 50% 55%,#141a3d,#02030a)}</style></noscript>
